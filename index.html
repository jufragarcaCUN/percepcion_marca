<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percepción de Marca · Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ===== USANDO EL CSS GLOBAL ===== -->
    <link rel="stylesheet" href="css/estilos.css">
    
   >
</head>
<body>

    <!-- ===== SIDEBAR (iframe) ===== -->
    <iframe src="components/sidebar.html" class="sidebar-iframe"></iframe>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <div class="main-content">

        <!-- ===== HERO - Percepción de Marca ===== -->
        <section class="hero">
            <div class="hero-text animate-fadeUp delay-1">
                <span class="badge"><i class="fas fa-chart-line"></i> Estudio 2026</span>
                <h1>
                    Percepción de<br />
                    <span class="highlight">Marca CUN</span>
                </h1>
                <p>
                    Investigación profunda sobre cómo las personas perciben la 
                    Corporación Unificada Nacional de Educación Superior en las 
                    14 ciudades priorizadas.
                </p>
                <div class="hero-buttons">
                    <a href="pages/Matriz_de_mapeo.html" class="btn btn-primary">
                        <i class="fas fa-sitemap"></i> Ver Matriz
                    </a>
                    <a href="pages/Ciudades_y_barrios.html" class="btn btn-secondary">
                        <i class="fas fa-city"></i> Ciudades
                    </a>
                </div>
            </div>

            <div class="hero-visual animate-fadeUp delay-2">
                <div class="hero-shapes">
                    <div class="box animate-float"></div>
                    <div class="circle animate-float"></div>
                    <div class="triangle animate-float"></div>
                    <div class="leaf animate-float"></div>
                    <div class="heart animate-pulse"></div>
                    <div class="moon animate-float"></div>
                </div>
            </div>
        </section>

        <!-- ===== ESTADÍSTICAS ===== -->
        <div class="stats animate-fadeUp delay-3">
            
            <div class="stat-item">
                <div class="number" id="count1">0</div>
                <div class="label">Ciudades Priorizadas</div>
            </div>
            <div class="stat-item">
                <div class="number" id="count2">0</div>
                <div class="label">Barrios Mapeados</div>
            </div>
            <div class="stat-item">
                <div class="number" id="count3">0</div>
                <div class="label">Segmentos Identificados</div>
            </div>
            <div class="stat-item">
                <div class="number" id="count4">0</div>
                <div class="label">Encuestas Aplicadas</div>
            </div>
        </div>

    </div>

    
    </script>

</body>
</html>
